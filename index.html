<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Pro - Simple</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0B0E11] text-white p-4"><h1 class="text-[#FCD535] font-bold">Nexus Pro - Real App LIVE</h1><p>Go to <a href="/enterprise" class="underline text-[#FCD535]">/enterprise - Full Suite</a></p><div id="tick"></div><script>setInterval(async()=>{try{const r=await fetch('/api/ticker');const d=await r.json();document.getElementById('tick').innerHTML=d.map(t=>`<div>${t.symbol}: ${t.price}</div>`).join('')}catch(e){}},2000)</script></body></html>
