<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDR TradeX - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #eaebd1; font-family: sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Header Navigation -->
    <header class="flex justify-between items-center p-3 border-b border-gray-800 bg-[#12161c]">
        <div class="flex items-center space-x-2">
            <img src="mdr-icon.png" class="h-6 w-6" alt="Logo">
            <span class="font-bold text-orange-500">MDR TradeX</span>
        </div>
        <button class="bg-orange-600 hover:bg-orange-500 px-3 py-1 text-xs rounded text-white font-semibold">
            Connect Real Wallet
        </button>
    </header>

    <!-- Main Chart Container -->
    <main class="flex-1 relative w-full h-full bg-[#0b0e11] p-2">
        <canvas id="chartCanvas" class="w-full h-full block"></canvas>
    </main>

    <!-- Live Candle Canvas Script -->
    <script>
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        async function fetchAndDrawCandles() {
            try {
                const res = await fetch('/api/ticker');
                const tickers = await res.json();
                const btc = tickers.find(t => t.symbol === 'BTCUSDT') || { price: 86400 };

                // Draw background grid & candles
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw live price watermark
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillText(`BTC $${btc.price}`, 30, 80);

                // Sample candle rendering pipeline
                const candleWidth = 8;
                const spacing = 4;
                const totalCandles = Math.floor(canvas.width / (candleWidth + spacing));
                
                let basePrice = btc.price;
                for (let i = 0; i < totalCandles; i++) {
                    const open = basePrice + (Math.sin(i * 0.2) * 50);
                    const close = open + (Math.cos(i * 0.3) * 40);
                    const high = Math.max(open, close) + Math.random() * 20;
                    const low = Math.min(open, close) - Math.random() * 20;

                    const x = i * (candleWidth + spacing);
                    const isGreen = close >= open;

                    // Normalize Y coordinates
                    const minY = 100, maxY = canvas.height - 100;
                    const scale = (val) => canvas.height - ((val - (btc.price - 300)) / 600) * (canvas.height - 200);

                    // Draw Wick
                    ctx.strokeStyle = isGreen ? '#0ecb81' : '#f6465d';
                    ctx.beginPath();
                    ctx.moveTo(x + candleWidth / 2, scale(high));
                    ctx.lineTo(x + candleWidth / 2, scale(low));
                    ctx.stroke();

                    // Draw Body
                    ctx.fillStyle = isGreen ? '#0ecb81' : '#f6465d';
                    ctx.fillRect(x, scale(Math.max(open, close)), candleWidth, Math.max(2, Math.abs(scale(open) - scale(close))));
                }
            } catch (err) {
                console.error("Failed to load candles:", err);
            }
        }

        // Poll market data every 2 seconds
        setInterval(fetchAndDrawCandles, 2000);
        fetchAndDrawCandles();
    </script>
</body>
</html>
