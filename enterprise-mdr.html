<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MDR TradeX - Global Trading Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>*{font-family:'Inter',sans-serif}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#2a3441;border-radius:10px}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}</style>
</head>
<body class="bg-[#090d12] text-white min-h-screen pb-[80px] lg:pb-0">
<header class="sticky top-0 z-50 bg-[#0f141c]/90 backdrop-blur-md border-b border-[#1e2733]">
<div class="max-w-[1600px] mx-auto px-3 lg:px-6 py-3 flex items-center justify-between gap-2">
<div class="flex items-center gap-3 min-w-0">
<div class="w-10 h-10 rounded-full bg-[#1a2332] border border-[#2a3441] overflow-hidden flex items-center justify-center flex-shrink-0">
<img id="logoImg" src="/mdr-logo.png" onerror="this.onerror=null;this.src='/nexus-real-app/mdr-logo.png'" class="w-full h-full object-cover">
</div>
<div class="min-w-0"><div class="flex items-center gap-1 font-bold text-[15px]"><span class="text-[#f0c419]">MDR</span><span>TradeX</span></div><div class="text-[9px] tracking-[0.2em] text-gray-400 uppercase hidden sm:block">Global Trading Platform</div></div>
</div>
<div class="flex items-center gap-2"><div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#0d281f] border border-[#1a4d3a] text-[11px] text-[#00d084] font-semibold"><span class="w-2 h-2 rounded-full bg-[#00d084] animate-pulse"></span>LIVE REAL WALLET</div>
<button class="w-10 h-10 lg:w-auto lg:px-4 bg-[#1a1f2a] border border-[#2a3441] rounded-xl flex items-center justify-center gap-2">🤖<span class="hidden lg:block text-sm">AI</span></button>
<button id="walletBtn" class="h-10 px-4 bg-[#ff8c32] text-white rounded-xl text-[13px] font-bold">Connect Real Wallet</button>
</div>
</div>
<div class="max-w-[1600px] mx-auto px-3 lg:px-6 flex items-center gap-6 border-b border-[#1a2332] overflow-x-auto"><button class="py-3 text-[13px] font-bold text-[#f0c419] border-b-2 border-[#f0c419]">Trade</button><button class="py-3 text-[13px] text-gray-500">Earn</button><button class="py-3 text-[13px] text-gray-500">Admin</button><button class="py-3 text-[13px] text-gray-500">Auth</button></div>
</header>
<div class="max-w-[1600px] mx-auto px-3 lg:px-6 py-3 flex items-center gap-3 flex-wrap bg-[#0f141c] border-b border-[#1a2332]"><div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full bg-[#f7931a] flex items-center justify-center font-bold text-black text-sm">B</div><span class="font-bold text-sm">BTC/USDT</span><span class="px-2 py-0.5 rounded bg-[#2a2310] text-[#f0c419] text-[10px] font-bold border border-[#3d3215]">MDR • <span id="levLabel">50x</span></span></div><div class="flex items-center gap-3 ml-auto sm:ml-0"><span id="livePrice" class="text-[#00d084] font-bold text-[16px]">$80,444.01</span><span id="liveChange" class="text-[#f0c419] text-[12px]">+0.0100%</span></div></div>
<div class="max-w-[1600px] mx-auto lg:grid lg:grid-cols-[1fr_380px] lg:gap-4 p-0 lg:p-4">
<div class="bg-[#0f141c] lg:rounded-2xl border-b lg:border border-[#1e2733] overflow-hidden"><div class="p-3 flex gap-2"><button class="px-3 py-1 rounded-full text-xs bg-[#1a1f2a]">1m</button><button class="px-3 py-1 rounded-full text-xs bg-[#2a2310] text-[#f0c419]">5m</button><button class="px-3 py-1 rounded-full text-xs bg-[#1a1f2a] text-gray-400">15m</button><button class="px-3 py-1 rounded-full text-xs bg-[#1a1f2a] text-gray-400">1H</button></div><div id="chart" class="w-full h-[380px] lg:h-[520px] bg-[#090d12]"></div><div id="chartLoader" class="p-4 text-center text-gray-500 text-sm">Loading /api/history/BTCUSDT...</div></div>
<div class="bg-[#0f141c] lg:rounded-2xl border-t lg:border border-[#1e2733] p-4 space-y-4">
<div class="flex bg-[#090d12] rounded-xl p-1 border border-[#1e2733]"><button class="flex-1 py-2 text-xs font-bold bg-[#1a1f2a] text-white rounded-lg">Limit</button><button class="flex-1 py-2 text-xs text-gray-500">Market</button><button class="flex-1 py-2 text-xs text-gray-500">Stop</button></div>
<div class="space-y-2"><label class="text-[11px] text-gray-400 uppercase">Price [USDT]</label><div class="relative"><input id="priceInput" type="number" value="67284.50" class="w-full h-[52px] bg-[#090d12] border border-[#2a3441] rounded-xl px-4 text-[18px] font-semibold outline-none"><div class="absolute right-1 top-1 bottom-1 flex gap-1"><button onclick="adjPrice(-10)" class="w-8 bg-[#1a1f2a] rounded-lg">-</button><button onclick="adjPrice(10)" class="w-8 bg-[#1a1f2a] rounded-lg">+</button></div></div></div>
<div class="grid grid-cols-2 gap-3"><div class="space-y-2"><label class="text-[11px] text-gray-400 uppercase">Size [USDT]</label><input id="sizeInput" type="number" value="100" class="w-full h-[52px] bg-[#090d12] border border-[#2a3441] rounded-xl px-4 text-[16px] font-semibold"><div class="flex gap-1"><button onclick="setSizePct(25)" class="flex-1 h-7 bg-[#1a1f2a] rounded text-[10px]">25%</button><button onclick="setSizePct(50)" class="flex-1 h-7 bg-[#1a1f2a] rounded text-[10px]">50%</button><button onclick="setSizePct(100)" class="flex-1 h-7 bg-[#1a1f2a] rounded text-[10px]">100%</button></div></div><div class="space-y-2"><label class="text-[11px] text-[#f0c419] font-bold">Lot Size ⭐ NEW</label><div class="flex h-[52px] bg-[#090d12] border border-[#2a3441] rounded-xl overflow-hidden"><button onclick="adjLot(-0.01)" class="w-10 bg-[#1a1f2a]">-</button><input id="lotInput" type="number" value="0.01" step="0.01" class="flex-1 text-center bg-transparent font-bold outline-none"><button onclick="adjLot(0.01)" class="w-10 bg-[#1a1f2a]">+</button></div><div class="text-[10px] text-gray-500 text-center">1 Lot = 100 USDT</div></div></div>
<div class="space-y-2"><div class="flex justify-between"><label class="text-[11px] text-gray-400">Leverage</label><span id="levVal" class="text-[#f0c419] text-xs font-bold">50x</span></div><div class="flex gap-2"><button onclick="setLev(10)" class="levBtn flex-1 h-9 rounded-xl bg-[#1a1f2a] border border-[#2a3441] text-xs">10x</button><button onclick="setLev(25)" class="flex-1 h-9 rounded-xl bg-[#1a1f2a] border text-xs">25x</button><button onclick="setLev(50)" class="flex-1 h-9 rounded-xl bg-[#2a2310] border border-[#f0c419] text-[#f0c419] font-bold">50x</button><button onclick="setLev(100)" class="flex-1 h-9 rounded-xl bg-[#1a1f2a] border text-xs">100x</button></div><input id="levSlider" type="range" min="1" max="100" value="50" class="w-full accent-[#f0c419]"></div>
<div class="bg-[#090d12] rounded-xl border border-[#1e2733] p-3 grid grid-cols-2 gap-3 text-[11px]"><div><div class="text-gray-500">Margin</div><div id="marginVal" class="font-bold">$2.00</div></div><div><div class="text-gray-500">Fee</div><div id="feeVal" class="font-bold">$0.04</div></div><div><div class="text-gray-500">Liq Long</div><div id="liqLong" class="text-[#ff4757]">$66,100</div></div><div><div class="text-gray-500">Liq Short</div><div id="liqShort" class="text-[#00d084]">$68,400</div></div></div>
<div class="grid grid-cols-2 gap-3"><button id="buyBtn" class="h-[56px] rounded-xl bg-[#00d084] text-black font-bold text-[14px]">BUY / LONG<br><span id="buySub" class="text-[10px]">0.01 LOT</span></button><button id="sellBtn" class="h-[56px] rounded-xl bg-[#ff4757] text-white font-bold text-[14px]">SELL / SHORT<br><span id="sellSub" class="text-[10px]">0.01 LOT</span></button></div>
</div>
</div>
<div class="lg:hidden fixed bottom-0 left-0 right-0 bg-[#0f141c] border-t border-[#1e2733] flex justify-around py-2 z-50"><button class="flex flex-col items-center text-[#f0c419]"><span>📈</span><span class="text-[10px] font-bold">Trade</span></button><button class="flex flex-col items-center text-gray-500"><span>💰</span><span class="text-[10px]">Earn</span></button><button class="flex flex-col items-center text-gray-500"><span>🛡️</span><span class="text-[10px]">Admin</span></button><button class="flex flex-col items-center text-gray-500"><span>👤</span><span class="text-[10px]">Auth</span></button></div>
<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-[#1a1f2a] border px-5 py-3 rounded-xl text-sm hidden z-[100]"></div>
<script>
const $=id=>document.getElementById(id); let leverage=50, lot=0.01, chart, candleSeries;
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000);}
function adjPrice(d){$('priceInput').value=(parseFloat($('priceInput').value||0)+d).toFixed(2);updateCalc();}
function adjLot(d){lot=Math.max(0.01, +(parseFloat($('lotInput').value||0)+d).toFixed(2));$('lotInput').value=lot.toFixed(2);$('sizeInput').value=(lot*100).toFixed(0);updateCalc();}
function setSizePct(p){let b=1000;$('sizeInput').value=Math.round(b*p/100);lot=parseFloat($('sizeInput').value)/100;$('lotInput').value=lot.toFixed(2);updateCalc();}
function setLev(v){leverage=v;$('levSlider').value=v;$('levVal').textContent=v+'x';document.getElementById('levLabel').textContent=v+'x';updateCalc();}
function updateCalc(){const price=parseFloat($('priceInput').value)||67284.5;const size=parseFloat($('sizeInput').value)||100;lot=parseFloat($('lotInput').value)||size/100;const margin=size/leverage;const fee=size*0.0004;$('marginVal').textContent='$'+margin.toFixed(2);$('feeVal').textContent='$'+fee.toFixed(2);$('liqLong').textContent='$'+(price*(1-0.9/leverage)).toFixed(0);$('liqShort').textContent='$'+(price*(1+0.9/leverage)).toFixed(0);$('buySub').textContent=lot.toFixed(2)+' LOT';$('sellSub').textContent=lot.toFixed(2)+' LOT';}
$('priceInput').addEventListener('input',updateCalc);$('sizeInput').addEventListener('input',()=>{let s=parseFloat($('sizeInput').value)||0;$('lotInput').value=(s/100).toFixed(2);updateCalc();});$('lotInput').addEventListener('input',()=>{let l=parseFloat($('lotInput').value)||0.01;$('sizeInput').value=Math.round(l*100);updateCalc();});$('levSlider').addEventListener('input',e=>setLev(parseInt(e.target.value)));
$('buyBtn').onclick=()=>toast(`BUY ${lot.toFixed(2)} LOT @ ${$('priceInput').value}`);$('sellBtn').onclick=()=>toast(`SELL ${lot.toFixed(2)} LOT @ ${$('priceInput').value}`);$('walletBtn').onclick=()=>toast('Real Wallet Connected ✅');
function normalizeCandle(c){let o=parseFloat(c.open),h=parseFloat(c.high),l=parseFloat(c.low),cl=parseFloat(c.close);let t=c.timestamp||c.time;if(t>1e12)t=Math.floor(t/1000);let high=Math.max(o,h,l,cl),low=Math.min(o,h,l,cl);if(high===low){high+=5;low-=5;}return{time:t,open:o,high:high,low:low,close:cl};}
async function initChart(){const el=document.getElementById('chart');try{if(window.LightweightCharts){chart=LightweightCharts.createChart(el,{layout:{background:{color:'#090d12'},textColor:'#8a9bb0'},grid:{vertLines:{color:'#141a24'},horzLines:{color:'#141a24'}},width:el.clientWidth,height:el.clientHeight});candleSeries=chart.addCandlestickSeries({upColor:'#00d084',downColor:'#ff4757',borderDownColor:'#ff4757',borderUpColor:'#00d084',wickDownColor:'#ff4757',wickUpColor:'#00d084'});}}catch(e){}let candles=[];try{const r=await fetch('/api/history/BTCUSDT');const data=await r.json();if(Array.isArray(data)&&data.length>5){candles=data.map(normalizeCandle).filter(c=>c.time).slice(-200);}}catch(e){}if(candles.length<10){let base=80500,now=Math.floor(Date.now()/1000)-80*60;candles=[];for(let i=0;i<80;i++){let o=base+(Math.random()-0.5)*120;let cl=o+(Math.random()-0.5)*80;let h=Math.max(o,cl)+Math.random()*40;let l=Math.min(o,cl)-Math.random()*40;candles.push({time:now+i*60,open:o,high:h,low:l,close:cl});base=cl;}}if(candleSeries){candleSeries.setData(candles);chart.timeScale().fitContent();}$('chartLoader').style.display='none';setInterval(async()=>{try{const r=await fetch('/api/ticker');const ticks=await r.json();const btc=ticks.find(t=>t.symbol==='BTCUSDT')||ticks[0];if(btc){$('livePrice').textContent='$'+Number(btc.price).toLocaleString();if(candleSeries&&candles.length){const last=candles[candles.length-1];const updated={...last,close:Number(btc.price),high:Math.max(last.high,Number(btc.price)),low:Math.min(last.low,Number(btc.price))};candleSeries.update(updated);}}}catch(e){}},3000);window.addEventListener('resize',()=>{if(chart){chart.applyOptions({width:el.clientWidth,height:el.clientHeight});}});}initChart();updateCalc();
</script>
</body>
</html>
